<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Section 1: Hero with parallax -->
    <section class="parallax-section hero">
        <div class="parallax-bg" style="background-image: url('hero-bg.jpg');"></div>
        <div class="content">
            <h1>Welcome to Our World</h1>
            <p>Scroll down to explore</p>
        </div>
    </section>

    <!-- Section 2: Content -->
    <section class="content-section">
        <h2>About Us</h2>
        <p>Your content here...</p>
    </section>

    <!-- Section 3: Another parallax section -->
    <section class="parallax-section">
        <div class="parallax-bg" style="background-image: url('mid-bg.jpg');"></div>
        <div class="content">
            <h2>Amazing Feature</h2>
        </div>
    </section>

    <!-- Add more sections as needed -->
    <script src="script.js"></script>
</body>
</html>
